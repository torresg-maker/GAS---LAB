</style></head><body>
<header><h1>GAS LAB<small>Simulador de propiedades de los gases ideales</small></h1>
<div class="modes" id="modes"><button data-m="guided" class="on">Modo guiado</button><button data-m="free">Modo libre</button></div></header>
<div class="app"><nav id="menu" aria-label="Experimentos"></nav>
<div class="main"><div class="col"><div class="card"><h2 id="ttl"></h2><canvas id="cv" width="520" height="340"></canvas><p class="note" id="cap"></p></div>
<div class="card"><h2>Datos</h2><div id="form"></div></div></div>
<div class="col"><div class="card"><h2>Resultados y procedimiento</h2><div id="out"><p class="note">Introduce los datos y pulsa «Calcular».</p></div></div></div></div></div>
<script>
/*CORE*/
const PU={atm:1,Pa:1/101325,kPa:1000/101325,mmHg:1/760};      // factor: 1 unidad = x atm
const VU={L:1,mL:1e-3,'m³':1e3};                               // factor: 1 unidad = x L
const MU={g:1,kg:1000,mg:1e-3};                                // factor: 1 unidad = x g
const R_ATM=0.082057366;                                       // L·atm/(mol·K)  (= 8.314462618 J/(mol·K) / 101.325)
const GASES={'O₂':32.00,'N₂':28.01,'CO₂':44.01,'H₂':2.016,'He':4.003,'Ar':39.95,'CH₄':16.04,'NH₃':17.03,'Aire':28.97}; // g/mol
const UNITS={P:Object.keys(PU),V:Object.keys(VU),T:['K','°C'],n:['mol']};
const BASE={P:'atm',V:'L',T:'K',n:'mol'},SUB=['','₁','₂'],NAMES={P:'La presión',V:'El volumen',T:'La temperatura',n:'La cantidad de gas'};
const sym=id=>id[0]+SUB[+id[1]];
function fmt(x){if(x===0)return'0';const a=Math.abs(x);if(a>=1e7||a<1e-4)return x.toExponential(4).replace('e+','×10^').replace('e','×10^');return String(Number(x.toPrecision(6)));}
function toBase(k,v,u){return k==='P'?v*PU[u]:k==='V'?v*VU[u]:(u==='°C'?v+273.15:v);}
function fromBase(k,v,u){return k==='P'?v/PU[u]:k==='V'?v/VU[u]:(u==='°C'?v-273.15:v);}
function parseNum(s,label){s=String(s==null?'':s).trim().replace(',','.');
 if(s==='')throw new Error(`Falta el valor de ${label}.`);
 if(!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s))throw new Error(`El valor de ${label} no es numérico.`);
 const x=parseFloat(s);if(!isFinite(x))throw new Error(`El valor de ${label} no es un número finito.`);return x;}
function readVar(k,idx,raw,u){const lab=k+SUB[idx],v=parseNum(raw,lab),b=toBase(k,v,u);
 if(k==='T'){if(b<=0)throw new Error(`La temperatura ${lab} = ${fmt(v)} ${u} equivale a ${fmt(b)} K. Debe ser mayor que 0 K (cero absoluto): no es físicamente posible.`);}
 else if(v<=0)throw new Error(`${NAMES[k]} ${lab} debe ser mayor que cero (se recibió ${fmt(v)} ${u}).`);
 return b;}
function readMolar(raw){const M=parseNum(raw,'la masa molar M');if(M<=0)throw new Error(`La masa molar M debe ser mayor que cero (se recibió ${fmt(M)} g/mol).`);return M;}
const LAWS={
 boyle:{vars:{P:1,V:1},formula:'P₁ × V₁ = P₂ × V₂',consts:'temperatura (T) y cantidad de gas (n)',expl:'A temperatura constante, el producto P × V no cambia: si el volumen disminuye, las partículas chocan más seguido con las paredes y la presión aumenta.'},
 charles:{vars:{V:1,T:-1},formula:'V₁ / T₁ = V₂ / T₂',consts:'presión (P) y cantidad de gas (n)',expl:'A presión constante, el volumen es directamente proporcional a la temperatura absoluta (en kelvin).'},
 gay:{vars:{P:1,T:-1},formula:'P₁ / T₁ = P₂ / T₂',consts:'volumen (V) y cantidad de gas (n)',expl:'A volumen constante, al aumentar la temperatura las partículas se mueven más rápido y la presión aumenta proporcionalmente.'}};
function solveLaw(key,unk,inp){
 const L=LAWS[key],ks=Object.keys(L.vars);
 if(!/^[PVT][12]$/.test(unk)||!(unk[0] in L.vars))throw new Error('Elige una variable válida para calcular.');
 const uk=unk[0],us=+unk[1],val={},known=[];
 for(const s of[1,2])for(const k of ks){const id=k+s;if(id===unk)continue;const r=inp[id]||{};
  val[id]=readVar(k,s,r.v,r.u);
  known.push(`${sym(id)} = ${String(r.v).trim()} ${r.u}`+(r.u!==BASE[k]?`  →  ${fmt(val[id])} ${BASE[k]}`:''));}
 const e=L.vars[uk],num=[],den=[];
 for(const k of ks){const ex=L.vars[k];(ex>0?num:den).push(k+(3-us));if(k!==uk)(ex>0?den:num).push(k+us);}
 const [N,D]=e<0?[den,num]:[num,den];
 const fr=(f)=>{const n=N.length?N.map(f).join(' × '):'1';return D.length?`${n} / ${D.length>1?'('+D.map(f).join(' × ')+')':f(D[0])}`:n;};
 const pn=N.reduce((a,i)=>a*val[i],1),pd=D.reduce((a,i)=>a*val[i],1);
 if(!isFinite(pn)||!isFinite(pd)||pd===0)throw new Error('División entre cero o resultado indefinido.');
 const r=pn/pd;if(!isFinite(r)||r<=0)throw new Error('El resultado no es un valor físico válido.');
 const unit=(inp[unk]&&inp[unk].u)||BASE[uk],out=fromBase(uk,r,unit);
 const st={1:{},2:{}};for(const s of[1,2])for(const k of ks)st[s][k]=(k+s===unk)?r:val[k+s];
 const cambios=ks.map(k=>{const q=st[2][k]/st[1][k];return `${NAMES[k].toLowerCase().replace('la ','la ').replace('el ','el ')} ${q>1?'aumenta':q<1?'disminuye':'no cambia'} (factor ${fmt(q)})`;}).join('; ');
 const steps=[
  ['1. Datos conocidos',known.join('\n')],
  ['2. Variable desconocida',`${sym(unk)} (${NAMES[uk].toLowerCase().slice(3)})`],
  ['3. Fórmula',L.formula+`\nConstantes: ${L.consts}. Las temperaturas se usan en kelvin: K = °C + 273.15`],
  ['4. Despeje algebraico',`${sym(unk)} = ${fr(sym)}`],
  ['5. Sustitución con unidades',`${sym(unk)} = ${fr(i=>fmt(val[i])+' '+BASE[i[0]])}`],
  ['6. Operaciones',`${sym(unk)} = ${fmt(pn)} / ${fmt(pd)} = ${fmt(r)} ${BASE[uk]}`],
  ['7. Resultado final',`${sym(unk)} = ${fmt(out)} ${unit}`+(unit!==BASE[uk]?`   (${fmt(r)} ${BASE[uk]} convertido a ${unit})`:'')],
  ['8. Interpretación',`${L.expl}\nDel estado 1 al 2: ${cambios}.`]];
 return{value:out,unit,base:r,steps,st,id:unk,expl:L.expl};}
/* Ecuación de estado del gas ideal (un solo estado): P·V = n·R·T */
function idealGas(unk,inp,nMode){
 if(!['P','V','T','n'].includes(unk))throw new Error('Elige una variable válida para calcular.');
 if(nMode!=='masa')nMode='moles';
 const val={},known=[],U={P:'atm',V:'L',T:'K',n:'mol',R:'L·atm/(mol·K)'};
 for(const k of['P','V','T']){if(k===unk)continue;const r=inp[k]||{};val[k]=readVar(k,0,r.v,r.u);
  known.push(`${k} = ${String(r.v).trim()} ${r.u}`+(r.u!==BASE[k]?`  →  ${fmt(val[k])} ${BASE[k]}`:''));}
 let M=null;
 if(nMode==='masa'){M=readMolar((inp.M||{}).v);
  if(unk!=='n'){const r=inp.m||{},u=MU[r.u]?r.u:'g',m=parseNum(r.v,'la masa m');
   if(m<=0)throw new Error(`La masa m debe ser mayor que cero (se recibió ${fmt(m)} ${u}).`);
   const mg=m*MU[u];val.n=mg/M;
   known.push(`m = ${String(r.v).trim()} ${u}`+(u!=='g'?`  →  ${fmt(mg)} g`:''),`M = ${fmt(M)} g/mol`,`Conversión a moles: n = m / M = ${fmt(mg)} g / ${fmt(M)} g/mol = ${fmt(val.n)} mol`);}
  else known.push(`M = ${fmt(M)} g/mol`);}
 else if(unk!=='n'){const r=inp.n||{};val.n=readVar('n',0,r.v,'mol');known.push(`n = ${String(r.v).trim()} mol`);}
 val.R=R_ATM;known.push(`R = ${fmt(R_ATM)} L·atm/(mol·K)`);
 const F={P:[['n','R','T'],['V']],V:[['n','R','T'],['P']],T:[['P','V'],['n','R']],n:[['P','V'],['R','T']]}[unk];
 const fr=f=>`${F[0].map(f).join(' × ')} / ${F[1].length>1?'('+F[1].map(f).join(' × ')+')':f(F[1][0])}`;
 const pn=F[0].reduce((a,k)=>a*val[k],1),pd=F[1].reduce((a,k)=>a*val[k],1);
 if(!isFinite(pn)||!isFinite(pd)||pd===0)throw new Error('División entre cero o resultado indefinido.');
 const r=pn/pd;if(!isFinite(r)||r<=0)throw new Error('El resultado no es un valor físico válido.');
 const unit=unk==='n'?'mol':(inp[unk]&&UNITS[unk].includes(inp[unk].u)?inp[unk].u:BASE[unk]);
 const out=unk==='n'?r:fromBase(unk,r,unit),all=Object.assign({},val,{[unk]:r});delete all.R;
 const mass=(nMode==='masa'&&unk==='n')?r*M:null;
 const steps=[
  ['1. Datos conocidos',known.join('\n')],
  ['2. Variable desconocida',`${unk} (${NAMES[unk].toLowerCase().replace(/^(la|el) /,'')})`],
  ['3. Ecuación general','P × V = n × R × T'+(nMode==='masa'?'\nn = m / M':'')+'\nR = 0.082057366 L·atm/(mol·K): por eso P se convierte a atm y V a L antes de sustituir (R = 8.314462618 Pa·m³/(mol·K) es el mismo valor en unidades SI).\nLas temperaturas se usan en kelvin: K = °C + 273.15'],
  ['4. Despeje algebraico',`${unk} = ${fr(k=>k)}`],
  ['5. Sustitución con unidades',`${unk} = ${fr(k=>fmt(val[k])+' '+U[k])}`],
  ['6. Operaciones',`${unk} = ${fmt(pn)} / ${fmt(pd)} = ${fmt(r)} ${U[unk]}`],
  ['7. Resultado final',`${unk} = ${fmt(out)} ${unit}`+(unit!==U[unk]?`   (${fmt(r)} ${U[unk]} convertido a ${unit})`:'')+(mass!=null?`\nMasa equivalente: m = n × M = ${fmt(r)} mol × ${fmt(M)} g/mol = ${fmt(mass)} g`:'')]];
 return{value:out,unit,base:r,steps,id:unk,all,mass};}
function dalton(mode,gases,pt,pu,vt){
 if(gases.length<2)throw new Error('Agrega al menos dos gases a la mezcla.');
 const nm=gases.map((g,i)=>(g.name||'').trim()||`Gas ${i+1}`);
 const vals=gases.map((g,i)=>{const x=parseNum(g.v,(mode!=='parciales'?'los moles de ':'la presión parcial de ')+nm[i]);if(x<=0)throw new Error(`${nm[i]}: el valor debe ser mayor que cero.`);return x;});
 let rows,Pt,unit,nt=null,steps=[];
 if(mode==='moles'){const x=parseNum(pt.v,'la presión total');if(x<=0)throw new Error('La presión total debe ser mayor que cero.');
  Pt=x*PU[pt.u];unit=pt.u;const nt=vals.reduce((a,b)=>a+b,0);
  rows=vals.map((n,i)=>({name:nm[i],n,X:n/nt,P:n/nt*Pt}));
  steps=[['1. Datos conocidos',rows.map(r=>`n(${r.name}) = ${fmt(r.n)} mol`).join('\n')+`\nPtotal = ${fmt(x)} ${pt.u}`+(pt.u!=='atm'?` → ${fmt(Pt)} atm`:'')],
   ['2. Variable desconocida','Xi y Pi de cada gas'],['3. Fórmula','Xi = ni / ntotal\nPi = Xi × Ptotal\nPtotal = P₁ + P₂ + P₃ + …'],
   ['4. Despeje algebraico','Pi = (ni / ntotal) × Ptotal'],
   ['5. Sustitución con unidades',`ntotal = ${vals.map(fmt).join(' + ')} = ${fmt(nt)} mol\n`+rows.map(r=>`P(${r.name}) = (${fmt(r.n)} mol / ${fmt(nt)} mol) × ${fmt(Pt)} atm`).join('\n')],
   ['6. Operaciones',rows.map(r=>`X(${r.name}) = ${fmt(r.X)};  P(${r.name}) = ${fmt(r.X)} × ${fmt(Pt)} = ${fmt(r.P)} atm`).join('\n')]];
 }else if(mode==='mvt'){vt=vt||{};const rv=vt.V||{},rt=vt.T||{};
  const V=readVar('V',0,rv.v,rv.u||'L'),T=readVar('T',0,rt.v,rt.u||'K');
  nt=vals.reduce((a,b)=>a+b,0);const k=R_ATM*T/V;Pt=nt*k;unit=PU[pu]?pu:'atm';
  rows=vals.map((n,i)=>({name:nm[i],n,X:n/nt,P:n*k}));
  steps=[['1. Datos conocidos',rows.map(r=>`n(${r.name}) = ${fmt(r.n)} mol`).join('\n')+`\nV = ${String(rv.v).trim()} ${rv.u}`+(rv.u!=='L'?` → ${fmt(V)} L`:'')+`\nT = ${String(rt.v).trim()} ${rt.u}`+(rt.u!=='K'?` → ${fmt(T)} K`:'')+`\nR = ${fmt(R_ATM)} L·atm/(mol·K)`],
   ['2. Variable desconocida','ntotal, Ptotal, Xi y Pi de cada gas'],
   ['3. Fórmula','ntotal = n₁ + n₂ + n₃ + …\nPtotal = ntotal × R × T / V\nPi = ni × R × T / V\nXi = ni / ntotal\nLas temperaturas se usan en kelvin: K = °C + 273.15'],
   ['4. Despeje algebraico','Las ecuaciones ya están despejadas; todas comparten el factor R × T / V.'],
   ['5. Sustitución con unidades',`ntotal = ${vals.map(fmt).join(' + ')} = ${fmt(nt)} mol\nR × T / V = ${fmt(R_ATM)} L·atm/(mol·K) × ${fmt(T)} K / ${fmt(V)} L = ${fmt(k)} atm/mol\nPtotal = ${fmt(nt)} mol × ${fmt(k)} atm/mol`],
   ['6. Operaciones',`Ptotal = ${fmt(Pt)} atm\n`+rows.map(r=>`P(${r.name}) = ${fmt(r.n)} mol × ${fmt(k)} atm/mol = ${fmt(r.P)} atm;  X(${r.name}) = ${fmt(r.n)} / ${fmt(nt)} = ${fmt(r.X)}`).join('\n')]];
 }else{const ps=vals.map(v=>v*PU[pu]);Pt=ps.reduce((a,b)=>a+b,0);unit=pu;
  rows=ps.map((p,i)=>({name:nm[i],P:p,X:p/Pt}));
  steps=[['1. Datos conocidos',gases.map((g,i)=>`P(${nm[i]}) = ${fmt(vals[i])} ${pu}`+(pu!=='atm'?` → ${fmt(ps[i])} atm`:'')).join('\n')],
   ['2. Variable desconocida','Ptotal y Xi'],['3. Fórmula','Ptotal = P₁ + P₂ + P₃ + …\nXi = Pi / Ptotal'],['4. Despeje algebraico','Ptotal = Σ Pi'],
   ['5. Sustitución con unidades','Ptotal = '+ps.map(p=>fmt(p)+' atm').join(' + ')],['6. Operaciones',`Ptotal = ${fmt(Pt)} atm\n`+rows.map(r=>`X(${r.name}) = ${fmt(r.P)} / ${fmt(Pt)} = ${fmt(r.X)}`).join('\n')]];}
 const sP=rows.reduce((a,r)=>a+r.P,0),sX=rows.reduce((a,r)=>a+r.X,0);
 if(Math.abs(sP-Pt)>1e-9*Pt||Math.abs(sX-1)>1e-9)throw new Error('Error interno de coherencia: ΣPi ≠ Ptotal.');
 const Ptd=Pt/PU[unit];
 steps.push(['7. Resultado final',`Ptotal = ${fmt(Ptd)} ${unit}\n`+rows.map(r=>`X(${r.name}) = ${fmt(r.X)};  P(${r.name}) = ${fmt(r.P/PU[unit])} ${unit}`).join('\n')+(nt!=null?`\nntotal = ${fmt(nt)} mol`:'')+`\nΣXi = ${fmt(sX)}\nComprobación: ΣPi = ${fmt(sP/PU[unit])} ${unit} = Ptotal ✓`],
  ['8. Interpretación','La presión total es la suma de las presiones parciales: cada gas ejerce la presión que tendría si ocupara solo el recipiente, proporcional a su fracción molar.']);
 return{rows,Pt,Ptd,unit,steps,PU};}
/* Densidad de un gas ideal: ρ = P·M / (R·T)  (no requiere masa ni volumen de la muestra) */
function gasDensity(inp){
 const M=readMolar((inp.M||{}).v),rp=inp.P||{},rt=inp.T||{};
 const P=readVar('P',0,rp.v,rp.u),T=readVar('T',0,rt.v,rt.u);
 const pn=P*M,pd=R_ATM*T;
 if(!isFinite(pn)||!isFinite(pd)||pd===0)throw new Error('División entre cero o resultado indefinido.');
 const rho=pn/pd;if(!isFinite(rho)||rho<=0)throw new Error('El resultado no es un valor físico válido.');
 const name=(inp.name||'').trim();
 const steps=[['1. Datos conocidos',(name?`Gas: ${name}\n`:'')+`M = ${fmt(M)} g/mol\nP = ${String(rp.v).trim()} ${rp.u}`+(rp.u!=='atm'?`  →  ${fmt(P)} atm`:'')+`\nT = ${String(rt.v).trim()} ${rt.u}`+(rt.u!=='K'?`  →  ${fmt(T)} K`:'')+`\nR = ${fmt(R_ATM)} L·atm/(mol·K)`],
  ['2. Variable desconocida','ρ (densidad del gas)'],
  ['3. Fórmula','P × V = n × R × T   con   n = m / M   y   ρ = m / V\nρ = P × M / (R × T)\nLas temperaturas se usan en kelvin: K = °C + 273.15'],
  ['4. Despeje algebraico','P × V = (m / M) × R × T  →  P × M = (m / V) × R × T  →  ρ = (P × M) / (R × T)'],
  ['5. Sustitución con unidades',`ρ = (${fmt(P)} atm × ${fmt(M)} g/mol) / (${fmt(R_ATM)} L·atm/(mol·K) × ${fmt(T)} K)`],
  ['6. Operaciones',`ρ = ${fmt(pn)} atm·g/mol / ${fmt(pd)} L·atm/mol = ${fmt(rho)} g/L`],
  ['7. Resultado final',`ρ = ${fmt(rho)} g/L  (= ${fmt(rho)} kg/m³ = ${fmt(rho/1000)} g/mL)`],
  ['8. Interpretación','La densidad de un gas ideal solo depende de P, T y su masa molar, no de la cantidad de muestra: aumenta con la presión y la masa molar, y disminuye al aumentar la temperatura.']];
 return{rho,P,T,M,steps};}
/*ENDCORE*/

/* ===== Interfaz ===== */
const EXPS=[{id:'boyle',n:'1. Ley de Boyle',c:'#2563eb'},{id:'charles',n:'2. Ley de Charles',c:'#e07a1f'},{id:'gay',n:'3. Ley de Gay-Lussac',c:'#c62f4b'},{id:'general',n:'4. Ecuación general (PV = nRT)',c:'#7c3aed'},{id:'dalton',n:'5. Ley de Dalton',c:'#0f9d8a'},{id:'dens',n:'6. Densidad de gases',c:'#5a8f29'}];
const EX={boyle:{P1:2,V1:3,V2:1.5,u:'P2'},charles:{V1:2,T1:300,T2:450,u:'V2'},gay:{P1:1,T1:300,T2:360,u:'P2'}};
const PAL=['#2563eb','#e07a1f','#c62f4b','#0f9d8a','#7c3aed','#a3a300'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let exp='boyle',mode='guided',gases=[{name:'N₂',v:''},{name:'O₂',v:''}];
const lab={cur:{vol:1,spd:.6,p:.5,n:40},tgt:{vol:1,spd:.6,p:.5,n:40},piston:true,cols:[PAL[0]]};
$('#menu').innerHTML=EXPS.map(e=>`<button data-e="${e.id}" style="--k:${e.c}">${e.n}</button>`).join('');
$('#menu').onclick=e=>{const b=e.target.closest('button');if(b){exp=b.dataset.e;render();}};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));render();}};
const unitSel=(id,k,sel)=>`<select id="u${id}" aria-label="Unidad">${UNITS[k].map(u=>`<option${u===(sel||BASE[k])?' selected':''}>${u}</option>`).join('')}</select>`;
function render(){const E=EXPS.find(e=>e.id===exp);document.documentElement.style.setProperty('--c',E.c);
 document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('on',b.dataset.e===exp));
 $('#ttl').textContent=E.n.slice(3);$('#out').innerHTML='<p class="note">Introduce los datos y pulsa «Calcular».</p>';
 lab.piston=['boyle','charles'].includes(exp);lab.cols=[E.c];lab.counts=null;setLab({vol:1,spd:.6,p:.5,n:40},true);
 $('#cap').textContent=exp==='general'?'Un único estado del gas: la cantidad de partículas representa n, su rapidez la temperatura y el color de las paredes la presión.':exp==='dalton'?'Cada color representa un gas distinto.':exp==='dens'?'La cantidad de partículas en el recipiente representa la densidad del gas (masa por unidad de volumen).':lab.piston?'Pistón móvil: su posición representa el volumen y la rapidez de las partículas representa la temperatura.':'Recipiente rígido: el volumen no cambia; el color de las paredes indica la presión.';
 if(LAWS[exp])formLaw();else if(exp==='dalton')formDalton();else if(exp==='general')formIdeal();else formDensity();}
function formLaw(){const L=LAWS[exp],ks=Object.keys(L.vars),ids=[];
 for(const s of(mode==='guided'?[2]:[1,2]))for(const k of ks)ids.push(k+s);
 let h=`<p class="const"><b>Constantes:</b> ${L.consts}.<br><b>Ecuación:</b> ${L.formula}</p>
 <label>Variable a calcular<select id="unk">${ids.map(i=>`<option value="${i}">${sym(i)} (${NAMES[i[0]].toLowerCase().slice(3)})</option>`).join('')}</select></label>`;
 for(const s of[1,2]){h+=`<h4>Estado ${s===1?'inicial':'final'}</h4>`;for(const k of ks){const id=k+s;h+=`<div class="row"><label for="i${id}">${sym(id)}</label><input id="i${id}" inputmode="decimal" autocomplete="off">${unitSel(id,k)}</div>`;}}
 $('#form').innerHTML=h+`<button class="go" id="calc">Calcular</button><button class="sm" id="ex">Cargar ejemplo</button>`;
 const upd=()=>{const u=$('#unk').value;for(const s of[1,2])for(const k of ks){const i=$('#i'+k+s);i.disabled=(k+s===u);if(i.disabled){i.value='';i.placeholder='calculado';}else i.placeholder='';}};
 $('#unk').onchange=upd;upd();$('#calc').onclick=calcLaw;
 $('#ex').onclick=()=>{const e=EX[exp];if(mode==='guided'&&e.u[1]==='1')return;$('#unk').value=e.u;upd();
  for(const s of[1,2])for(const k of ks){const i=$('#i'+k+s);if(!i.disabled){i.value=e[k+s];$('#u'+k+s).value=BASE[k];}}};}
function calcLaw(){try{const ks=Object.keys(LAWS[exp].vars),inp={};
 for(const s of[1,2])for(const k of ks)inp[k+s]={v:$('#i'+k+s).value,u:$('#u'+k+s).value};
 const r=solveLaw(exp,$('#unk').value,inp);
 showSteps(r.steps,`<div class="res">${sym(r.id)} = ${fmt(r.value)} ${r.unit}</div>`);
 const a=r.st[1],b=r.st[2],mx=k=>Math.max(a[k]||0,b[k]||0),f=(s,k)=>s[k]?s[k]/mx(k):1;
 const view=s=>({vol:lab.piston&&s.V?Math.max(.3,f(s,'V')):1,spd:s.T?Math.sqrt(s.T/mx('T'))*.9+.1:.6,p:s.P?s.P/mx('P'):.5,n:40});
 setLab(view(a),true);setTimeout(()=>setLab(view(b)),600);
 }catch(e){err(e);}}
function err(e){$('#out').innerHTML=`<div class="err" role="alert">⚠ ${esc(e.message)}</div>`;}
function showSteps(steps,head){$('#out').innerHTML=head+steps.map(s=>`<div class="step"><b>${s[0]}</b><div>${esc(s[1])}</div></div>`).join('');}
function formDalton(){let h=`<p class="const"><b>Ecuaciones:</b> Ptotal = P₁ + P₂ + …;  Pᵢ = Xᵢ × Ptotal</p>
 <label>Datos conocidos<select id="dm"><option value="mvt">Moles de cada gas + volumen y temperatura</option><option value="moles">Moles de cada gas + presión total</option><option value="parciales">Presión parcial de cada gas</option></select></label><div id="gl"></div>
 <button class="sm" id="add">+ Agregar gas</button><button class="sm" id="del">− Quitar gas</button><div id="ptw"><h4>Presión total</h4><div class="row"><label for="pt">Ptotal</label><input id="pt" inputmode="decimal">${unitSel('pt','P')}</div></div>
 <div id="vtw"><h4>Recipiente (volumen y temperatura compartidos)</h4><div class="row"><label for="dv">V</label><input id="dv" inputmode="decimal" autocomplete="off">${unitSel('dv','V')}</div><div class="row"><label for="dtk">T</label><input id="dtk" inputmode="decimal" autocomplete="off">${unitSel('dtk','T')}</div></div>
 <div id="pw" style="display:none"><h4>Unidad de las presiones</h4>${unitSel('pp','P')}</div><button class="go" id="calc">Calcular</button><button class="sm" id="ex">Cargar ejemplo</button>`;
 $('#form').innerHTML=h;const draw=()=>{const m=$('#dm').value;$('#gl').innerHTML=gases.map((g,i)=>`<div class="row g"><input aria-label="Nombre del gas" id="gn${i}" value="${esc(g.name)}"><input id="gv${i}" inputmode="decimal" placeholder="${m==='parciales'?'presión':'mol'}" value="${esc(g.v)}"><span style="color:${PAL[i%6]}">●</span></div>`).join('');
  $('#ptw').style.display=m==='moles'?'':'none';$('#vtw').style.display=m==='mvt'?'':'none';$('#pw').style.display=m==='moles'?'none':'';};
 const sv=()=>gases.forEach((g,i)=>{g.name=$('#gn'+i).value;g.v=$('#gv'+i).value;});
 $('#dm').onchange=()=>{sv();draw();};$('#add').onclick=()=>{sv();if(gases.length<6)gases.push({name:'Gas '+(gases.length+1),v:''});draw();};
 $('#del').onclick=()=>{sv();if(gases.length>2)gases.pop();draw();};draw();
 $('#ex').onclick=()=>{if($('#dm').value==='mvt'){gases=[{name:'N₂',v:'0.40'},{name:'O₂',v:'0.10'},{name:'CO₂',v:'0.050'}];draw();$('#dv').value='12.0';$('#udv').value='L';$('#dtk').value='25';$('#udtk').value='°C';$('#upp').value='atm';return;}
  gases=[{name:'N₂',v:'3'},{name:'O₂',v:'1'}];$('#dm').value='moles';draw();$('#pt').value='2';$('#upt').value='atm';};
 $('#calc').onclick=()=>{try{sv();const m=$('#dm').value;
  const r=dalton(m,gases,{v:$('#pt').value,u:$('#upt').value},$('#upp').value,{V:{v:$('#dv').value,u:$('#udv').value},T:{v:$('#dtk').value,u:$('#udtk').value}});
  const hn=r.rows[0].n!=null,sum=k=>r.rows.reduce((a,x)=>a+x[k],0);
  const tb=`<table><tr><th>Gas</th>${hn?'<th>nᵢ (mol)</th>':''}<th>Xᵢ</th><th>Pᵢ (${r.unit})</th></tr>${r.rows.map(x=>`<tr><td>${esc(x.name)}</td>${hn?`<td>${fmt(x.n)}</td>`:''}<td>${fmt(x.X)}</td><td>${fmt(x.P/PU[r.unit])}</td></tr>`).join('')}<tr><th>Total</th>${hn?`<th>${fmt(sum('n'))}</th>`:''}<th>${fmt(sum('X'))}</th><th>${fmt(sum('P')/PU[r.unit])}</th></tr></table>`;
  showSteps(r.steps,`<div class="res">Ptotal = ${fmt(r.Ptd)} ${r.unit}</div>${tb}`);
  lab.cols=r.rows.map((_,i)=>PAL[i%6]);lab.counts=r.rows.map(x=>Math.max(2,Math.round(x.X*60)));setLab({vol:1,spd:.6,p:.5,n:lab.counts.reduce((a,b)=>a+b,0)},true);
 }catch(e){err(e);}};}
function gasOpts(){return Object.keys(GASES).map(g=>`<option value="${g}">${g} (${GASES[g]} g/mol)</option>`).join('')+'<option value="">Otro (introducir masa molar)</option>';}
function bindGas(sel,inp){const u=()=>{const g=$(sel).value,i=$(inp);i.disabled=!!g;i.value=g?GASES[g]:'';i.placeholder=g?'':'g/mol';};$(sel).onchange=u;u();return u;}
const pvtRow=(p,k)=>`<div class="row"><label for="${p}${k}">${k}</label><input id="${p}${k}" inputmode="decimal" autocomplete="off">${unitSel(p+k,k)}</div>`;
const labOf=a=>({vol:1,spd:Math.min(1,Math.sqrt(a.T/600)),p:Math.min(1,a.P/5)});
function formIdeal(){const VN={P:'presión',V:'volumen',T:'temperatura',n:'cantidad de gas'};
 $('#form').innerHTML=`<p class="const"><b>Constante:</b> R = ${fmt(R_ATM)} L·atm/(mol·K).<br><b>Ecuación:</b> P × V = n × R × T  (un solo estado del gas)</p>
 <label>Variable a calcular<select id="unk">${['P','V','n','T'].map(k=>`<option value="${k}">Calcular ${VN[k]} (${k})</option>`).join('')}</select></label>
 <label>Cantidad de gas expresada como<select id="nmode"><option value="moles">Moles (n)</option><option value="masa">Masa (m) y masa molar (M)</option></select></label>
 <h4>Estado único del gas</h4>${pvtRow('g','P')}${pvtRow('g','V')}
 <div id="wn"><div class="row"><label for="gn">n</label><input id="gn" inputmode="decimal" autocomplete="off"><span>mol</span></div></div>
 ${pvtRow('g','T')}
 <div id="wm"><label>Gas<select id="ggas">${gasOpts()}</select></label>
  <div class="row"><label for="gm">m</label><input id="gm" inputmode="decimal" autocomplete="off"><select id="ugm" aria-label="Unidad">${Object.keys(MU).map(u=>`<option>${u}</option>`).join('')}</select></div>
  <div class="row"><label for="gM">M</label><input id="gM" inputmode="decimal" autocomplete="off"><span>g/mol</span></div></div>
 <button class="go" id="calc">Calcular</button><button class="sm" id="ex">Cargar ejemplo</button>`;
 const ug=bindGas('#ggas','#gM');
 const upd=()=>{const u=$('#unk').value,m=$('#nmode').value;
  $('#wn').style.display=m==='moles'?'':'none';$('#wm').style.display=m==='masa'?'':'none';
  for(const i of[$('#gP'),$('#gV'),$('#gT'),$('#gn'),$('#gm')]){const k=i.id.slice(1),off=k===u||(k==='m'&&u==='n');i.disabled=off;if(off){i.value='';i.placeholder='calculado';}else i.placeholder='';}};
 $('#unk').onchange=upd;$('#nmode').onchange=upd;upd();
 $('#ex').onclick=()=>{$('#unk').value='P';$('#nmode').value='moles';upd();
  $('#gV').value='10.0';$('#ugV').value='L';$('#gn').value='0.78125';$('#gT').value='20';$('#ugT').value='°C';$('#ugP').value='atm';};
 $('#calc').onclick=()=>{try{const v=k=>({v:$('#g'+k).value,u:$('#ug'+k).value});
  const r=idealGas($('#unk').value,{P:v('P'),V:v('V'),T:v('T'),n:{v:$('#gn').value,u:'mol'},m:{v:$('#gm').value,u:$('#ugm').value},M:{v:$('#gM').value}},$('#nmode').value);
  showSteps(r.steps,`<div class="res">${r.id} = ${fmt(r.value)} ${r.unit}</div>`+(r.mass!=null?`<p>Masa equivalente: m = ${fmt(r.mass)} g</p>`:''));
  setLab(Object.assign(labOf(r.all),{n:Math.max(4,Math.min(80,Math.round(r.all.n*30)))}),true);
 }catch(e){err(e);}};}
function formDensity(){$('#form').innerHTML=`<p class="const"><b>Ecuación:</b> ρ = P × M / (R × T)<br><b>Constante:</b> R = ${fmt(R_ATM)} L·atm/(mol·K). No se necesita la masa ni el volumen de la muestra.</p>
 <label>Gas<select id="dgas">${gasOpts()}</select></label>
 <div class="row"><label for="dM">M</label><input id="dM" inputmode="decimal" autocomplete="off"><span>g/mol</span></div>
 ${pvtRow('d','P')}${pvtRow('d','T')}
 <button class="go" id="calc">Calcular</button><button class="sm" id="ex">Cargar ejemplo</button>`;
 const ug=bindGas('#dgas','#dM');
 $('#ex').onclick=()=>{$('#dgas').value='CO₂';ug();$('#dP').value='0.737';$('#udP').value='atm';$('#dT').value='14';$('#udT').value='°C';};
 $('#calc').onclick=()=>{try{const g=$('#dgas').value;
  const r=gasDensity({name:g||'Gas personalizado',M:{v:$('#dM').value},P:{v:$('#dP').value,u:$('#udP').value},T:{v:$('#dT').value,u:$('#udT').value}});
  showSteps(r.steps,`<div class="res">ρ = ${fmt(r.rho)} g/L</div><p>${esc(g||'Gas personalizado')} · M = ${fmt(r.M)} g/mol · P = ${fmt(r.P)} atm · T = ${fmt(r.T)} K</p>`);
  setLab(Object.assign(labOf(r),{n:Math.max(4,Math.min(80,Math.round(r.rho*20)))}),true);
 }catch(e){err(e);}};}

/* ===== Laboratorio visual (solo ilustrativo: no interviene en los cálculos) ===== */
const cv=$('#cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;let parts=[];
function setLab(t,snap){Object.assign(lab.tgt,t);if(snap){Object.assign(lab.cur,t);}
 if(parts.length!==lab.tgt.n||snap){parts=[];const cs=lab.cols,cn=lab.counts&&exp==='dalton'?lab.counts:[lab.tgt.n];
  cn.forEach((c,gi)=>{for(let i=0;i<c;i++)parts.push({x:60+Math.random()*(W-120),y:100+Math.random()*180,a:Math.random()*6.28,c:cs[gi%cs.length]});});}}
function frame(){const c=lab.cur,t=lab.tgt;for(const k of['vol','spd','p'])c[k]+=(t[k]-c[k])*.05;
 const L=30,R=W-30,B=H-20,top0=40,top=B-(B-top0-20)*c.vol-0;cx.clearRect(0,0,W,H);
 cx.fillStyle=`hsla(${5},80%,${92-c.p*35}%,.7)`;cx.fillRect(L,top,R-L,B-top);
 cx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--c')||'#333';cx.lineWidth=5;cx.strokeRect(L,top,R-L,B-top);
 cx.fillStyle='#667';if(lab.piston){cx.fillRect(L,top-12,R-L,12);cx.fillRect(W/2-5,10,10,top-20);cx.fillRect(W/2-30,4,60,8);}
 for(const p of parts){const v=1.2+c.spd*3.2;p.x+=Math.cos(p.a)*v;p.y+=Math.sin(p.a)*v;
  if(p.x<L+5){p.x=L+5;p.a=Math.PI-p.a;}if(p.x>R-5){p.x=R-5;p.a=Math.PI-p.a;}
  if(p.y<top+5){p.y=top+5;p.a=-p.a;}if(p.y>B-5){p.y=B-5;p.a=-p.a;}
  cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,5,0,6.283);cx.fill();}
 requestAnimationFrame(frame);}
render();frame();
</script></body></html>
